spring.application.name=vitalis-citas-api
server.port=8080

# ---------------------------------------------------------------
# Configuración local de cada integrante (NO se sube a GitHub).
# Copiar application-local.properties.example como
# application-local.properties y poner ahí la clave de MySQL.
# ---------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

# ---------------------------------------------------------------
# Base de datos MySQL (script: docs/vitalis_citas_schema.sql)
# La contraseña NUNCA se escribe aquí: se toma de
# application-local.properties o de la variable de entorno
# DB_PASSWORD. Usuario por defecto: root (DB_USER).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vitalis_citas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------
# JPA / Hibernate
# El esquema lo crea el script SQL; Hibernate no lo modifica.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ---------------------------------------------------------------
# Seguridad: JWT (RF002)
# La clave de firma se lee de la variable de entorno JWT_SECRET
# (Base64, mínimo 256 bits). El valor por defecto es SOLO para
# desarrollo local; en producción siempre se define JWT_SECRET.
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dml0YWxpcy1jaXRhcy1jbGF2ZS1kZS1kZXNhcnJvbGxvLXNvbG8tbG9jYWwtMjAyNg==}
app.jwt.expiracion-minutos=60
app.login.max-intentos=5
app.login.minutos-bloqueo=15
